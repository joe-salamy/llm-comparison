[project]
name = "llm-comparison"
version = "0.1.0"
description = "Tools for converting and comparing Artificial Analysis LLM leaderboard data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
compare-models = "llm_comparison.compare_models:main"
convert-results = "llm_comparison.convert_results:main"
update-artificial-analysis = "llm_comparison.update_artificial_analysis:main"
update-opencode-go = "llm_comparison.update_opencode_go:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_comparison*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
update = [
    "playwright>=1.49",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".omp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/llm_comparison/compare_models_template.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
